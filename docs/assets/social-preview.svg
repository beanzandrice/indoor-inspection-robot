<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Unitree Go2 Navigation Bridge</title>
  <desc id="desc">Technical project card showing ROS 2 navigation through an SSH relay.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101526"/>
      <stop offset="0.52" stop-color="#1b2440"/>
      <stop offset="1" stop-color="#183c3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="640" rx="36" fill="url(#bg)"/>
  <g opacity="0.13" stroke="#c4b5fd" fill="none">
    <path d="M0 100H1280M0 200H1280M0 300H1280M0 400H1280M0 500H1280M0 600H1280"/>
    <path d="M100 0V640M200 0V640M300 0V640M400 0V640M500 0V640M600 0V640M700 0V640M800 0V640M900 0V640M1000 0V640M1100 0V640M1200 0V640"/>
  </g>
  <rect x="72" y="70" width="1136" height="500" rx="30" fill="#111a30" fill-opacity="0.9" stroke="#a78bfa" stroke-opacity="0.3" filter="url(#shadow)"/>
  <rect x="112" y="112" width="10" height="92" rx="5" fill="url(#accent)"/>
  <text x="154" y="154" fill="#ede9fe" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="600" letter-spacing="3">ROS 2 · NAV2 · SLAM</text>
  <text x="112" y="252" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="61" font-weight="700">Unitree Go2 Navigation Bridge</text>
  <text x="112" y="306" fill="#ddd6fe" font-family="Segoe UI,Arial,sans-serif" font-size="27">Remote mapping and navigation through a Raspberry Pi relay</text>
  <g transform="translate(112 386)" font-family="Segoe UI,Arial,sans-serif">
    <rect width="240" height="88" rx="18" fill="#202b48" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text x="120" y="38" text-anchor="middle" fill="#c4b5fd" font-size="19" font-weight="700">LAPTOP</text>
    <text x="120" y="65" text-anchor="middle" fill="#e2e8f0" font-size="17">RViz2 / Isaac Sim</text>
    <path d="M250 44H310" stroke="#34d399" stroke-width="5"/>
    <path d="m300 34 14 10-14 10" fill="none" stroke="#34d399" stroke-width="5"/>
    <rect x="324" width="240" height="88" rx="18" fill="#202b48" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text x="444" y="38" text-anchor="middle" fill="#c4b5fd" font-size="19" font-weight="700">RELAY</text>
    <text x="444" y="65" text-anchor="middle" fill="#e2e8f0" font-size="17">SSH via Raspberry Pi</text>
    <path d="M574 44H634" stroke="#34d399" stroke-width="5"/>
    <path d="m624 34 14 10-14 10" fill="none" stroke="#34d399" stroke-width="5"/>
    <rect x="648" width="240" height="88" rx="18" fill="#202b48" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text x="768" y="38" text-anchor="middle" fill="#c4b5fd" font-size="19" font-weight="700">ROBOT</text>
    <text x="768" y="65" text-anchor="middle" fill="#e2e8f0" font-size="17">Go2 + Nav2 + SLAM</text>
  </g>
  <text x="112" y="530" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="20">Bidirectional ROS bridge · Bounded transport · Remote visualization</text>
