name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indoor-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check "numpy<2" PyYAML pytest

      - name: Compile Python sources
        run: python -m compileall -q scripts go2_navigation isaac

      - name: Validate repository assets and documentation
        run: python tools/validation/validate_repository.py

      - name: Run hardware-independent tests
        run: python -m pytest -q tests

      - name: Check whitespace
        if: matrix.python-version == '3.11'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          base="$PR_BASE_SHA"
          if [[ -z "$base" ]] && [[ -n "$PUSH_BASE_SHA" ]] && git cat-file -e "$PUSH_BASE_SHA^{commit}" 2>/dev/null; then
            base="$PUSH_BASE_SHA"
          fi
          if [[ -z "$base" ]]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          git diff --check "$base" HEAD --

  shell:
    name: Shell validation
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Parse shell scripts
        run: find scripts go2_scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Run ShellCheck
        run: find scripts go2_scripts -name '*.sh' -print0 | xargs -0 shellcheck --severity=error
